name: CI observability

on:
  workflow_run:
    workflows: [CI, Widget Store comparison]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write # Posts the CI-esta sticky.

jobs:
  report:
    uses: gigaverse-app/ci-esta/.github/workflows/report.yml@78e5e2b078ce6d9b4df488a102c387f3548aa00a
    with:
      run-id: ${{ github.event.workflow_run.id }}
      run-attempt: ${{ github.event.workflow_run.run_attempt }}
      head-sha: ${{ github.event.workflow_run.head_sha }}
      pull-request-number: ${{ format('{0}', github.event.workflow_run.pull_requests[0].number || '') }}
      post-sticky: true
      sticky-key: ${{ github.event.workflow_run.name }}
      required-gates-json: ${{ github.event.workflow_run.name == 'CI' && '[{"kind":"actions_job","job_name":"Validation gate"}]' || '[{"kind":"actions_job","job_name":"Widget comparison gate"}]' }}
      analyze-critical-path: true
