name: dry-lint audit
# Weekly, or dispatched after merging a cleanup: dry-lint's own audit workflow sweeps the repository against the
# accepted backlog and opens or updates one dry-lint/ratchet pull request recording what was cleaned. Its steps ship
# with dry-lint releases; this file only says when it runs and with which credentials.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    uses: gigaverse-app/dry-lint/.github/workflows/audit.yml@feat/reusable-audit-workflow
    with:
      python-version: '3.14'
      budget-usd: '5'
      plugins: anthropic==2.4.0
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The organization credential makes the ratchet pull request run ordinary CI.
      DRY_LINT_RATCHET_TOKEN: ${{ secrets.GV_CI_CROSS_REPO_TOKEN }}
