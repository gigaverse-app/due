name: Widget Store comparison
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: widgets-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.policy.outputs.admitted }}
      required: ${{ steps.select.outcome != 'success' || toJSON(fromJSON(steps.policy.outputs.admitted || '{}').widget_comparison) != 'false' }}
      reused: ${{ steps.evidence.outputs.reused }}
      receipt: ${{ steps.evidence.outputs.receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        uses: gigaverse-app/pytest-selective/actions/plan-lanes@v1
        with:
          config: .github/test-lanes.json
      - id: policy
        name: Admit selected suites before provisioning
        uses: gigaverse-app/ci-esta/actions/plan-test-policy@103d686561b4a98408ee1727a452e8b3b6fcb1f7
        with:
          policy: .github/test-policy.json
          occasion: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
          affected: ${{ steps.select.outputs.lanes }}
      - id: evidence
        name: Find successful captures of these exact inputs
        if: >-
          ${{ github.event_name == 'pull_request' &&
              !contains(github.event.pull_request.labels.*.name, 'test:full') &&
              toJSON(fromJSON(steps.policy.outputs.admitted || '{}').widget_comparison) != 'false' }}
        uses: gigaverse-app/ci-esta/actions/resolve-lane-evidence@v1
        with:
          # Default identity binds the entire tested merge tree, base and head tree.
          # No local cache keys or incomplete hand-maintained input inventories.
          lanes: '{"widgets":"Widget comparison gate"}'

  compare:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          (needs.select-tests.outputs.required != 'false' &&
           toJSON(fromJSON(needs.select-tests.outputs.reused || '{}').widgets) != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Each capture retains its full workload on its own services/runner. Profiling
      # never competes with timing samples or another profile for CPU/DB resources.
      matrix:
        revision: [baseline, candidate]
        capture: [benchmark, cpu-1, cpu-2, wall]
        reverse: [false]
        include:
          - revision: baseline
            capture: benchmark
            reverse: true
          - revision: candidate
            capture: benchmark
            reverse: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: due
          POSTGRES_PASSWORD: due
          POSTGRES_DB: widget_due
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U due" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DUE_DATABASE_URL: postgresql://due:due@localhost:5432/widget_due
      DUE_BROKER_URL: redis://localhost:6379/0
      DBOS_DATABASE_URL: postgresql+psycopg://due:due@localhost:5432/widget_dbos
      DJANGO_SETTINGS_MODULE: examples.widget_store.settings
      PGPASSWORD: due
      DUE_COMPARE_SOURCE: ${{ matrix.revision == 'baseline' && '.widget-baseline' || '.' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dbos-inc/dbos-demo-apps
          ref: ddaf50e71fa8e19364d9c70b5d87a9c8203af152
          path: .widget-upstream
      - uses: actions/checkout@v7
        if: matrix.revision == 'baseline'
        with:
          repository: gigaverse-app/due
          ref: 1f1562416a0c0bc62f6c429dad88a2d7d84728f3
          path: .widget-baseline
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.14'
          sync-args: --all-packages
      - run: uv sync --directory .widget-baseline --all-packages --locked
        if: matrix.revision == 'baseline'
      - name: Install and verify headless Chromium
        if: matrix.capture == 'benchmark'
        run: |
          # These acceptance tests use the default headless shell, not a browser channel.
          uv run --no-sync playwright install --only-shell chromium
          probe=$(mktemp --suffix=.py)
          cat > "$probe" <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page()
              page.set_content('<button>Ready</button>')
              page.get_by_role('button', name='Ready').click()
              page.screenshot()
              browser.close()
          PY
          if ! uv run --no-sync python "$probe"; then
            # Recover runners missing system libraries; verify again before benchmarking.
            uv run --no-sync playwright install-deps chromium
            uv run --no-sync python "$probe"
          fi
      - run: uv sync --directory .widget-upstream/python/widget-store --locked --python 3.14
      - name: Enable measured PostgreSQL execution and WAL statistics
        env:
          WIDGET_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          psql -h localhost -U due -d widget_due -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          psql -h localhost -U due -d widget_due -c "ALTER SYSTEM SET track_io_timing = on"
          docker restart "$WIDGET_POSTGRES_CONTAINER"
          for _ in $(seq 1 30); do
            pg_isready -h localhost -U due && break
            sleep 1
          done
          psql -h localhost -U due -d widget_due -c "CREATE EXTENSION pg_stat_statements"
      - run: createdb -h localhost -U due widget_dbos
      - run: uv run python -m django migrate --noinput
      - run: uv run python -m django due_check
      - run: uv run --directory .widget-upstream/python/widget-store alembic upgrade head
      - run: uv run --directory .widget-upstream/python/widget-store python -m migrations.reset_database
      - name: Benchmark both real applications and exercise their crash buttons in Chromium
        if: matrix.capture == 'benchmark'
        env:
          WIDGET_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          WIDGET_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: uv run python -m scripts.widget_benchmark --due-source "$DUE_COMPARE_SOURCE" --upstream .widget-upstream --samples 5 --browser ${{ matrix.reverse && '--reverse' || '' }}
      - name: Capture a quality-gated CPU profile separately from timing
        if: startsWith(matrix.capture, 'cpu-')
        run: uv run python -m scripts.widget_profile --mode cpu --output "test-results/widgets/profile/${{ matrix.capture }}" -- --due-source "$DUE_COMPARE_SOURCE" --upstream .widget-upstream --samples 5
      - name: Profile wait paths including connection-loss recovery
        if: matrix.capture == 'wall'
        run: uv run python -m scripts.widget_profile --mode wall --output test-results/widgets/profile/wall -- --due-source "$DUE_COMPARE_SOURCE" --upstream .widget-upstream --samples 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: widget-store-${{ matrix.revision }}-reverse-${{ matrix.reverse }}${{ matrix.capture != 'benchmark' && format('-{0}', matrix.capture) || '' }}
          path: test-results/widgets/
          if-no-files-found: error

  comparison-gate:
    name: Widget comparison gate
    needs: [select-tests, compare]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all captures or matching successful evidence
        uses: gigaverse-app/ci-esta/actions/validation-gate@v1
        with:
          needs: '{"compare":${{ toJSON(needs.compare) }}}'
          required: >-
            {"compare":${{ needs.select-tests.result != 'success' ||
              (needs.select-tests.outputs.required != 'false' &&
               toJSON(fromJSON(needs.select-tests.outputs.reused || '{}').widgets) != 'true') }}}
      # Only actual complete execution establishes proof. A reused or empty run
      # cannot renew the 24-hour evidence lifetime or hide missing captures.
      - name: 'PR evidence #${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }}'
        if: ${{ github.event_name == 'pull_request' && needs.compare.result == 'success' }}
        run: echo 'All ten isolated captures completed successfully.'
      - name: ${{ needs.select-tests.outputs.receipt || 'No execution receipt' }}
        if: ${{ needs.compare.result == 'success' && needs.select-tests.outputs.receipt != '' }}
        run: echo 'Recording completed captures for this exact tested tree.'
