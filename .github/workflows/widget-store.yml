name: Widget Store comparison
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: widgets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        reverse: [false, true]
        revision: [baseline, candidate]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: due
          POSTGRES_PASSWORD: due
          POSTGRES_DB: widget_due
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U due" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DUE_DATABASE_URL: postgresql://due:due@localhost:5432/widget_due
      DUE_BROKER_URL: redis://localhost:6379/0
      DBOS_DATABASE_URL: postgresql+psycopg://due:due@localhost:5432/widget_dbos
      DJANGO_SETTINGS_MODULE: examples.widget_store.settings
      PGPASSWORD: due
      DUE_COMPARE_SOURCE: ${{ matrix.revision == 'baseline' && '.widget-baseline' || '.' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dbos-inc/dbos-demo-apps
          ref: ddaf50e71fa8e19364d9c70b5d87a9c8203af152
          path: .widget-upstream
      - uses: actions/checkout@v7
        if: matrix.revision == 'baseline'
        with:
          repository: gigaverse-app/due
          ref: a3024ebafbbf816c9d2a0b9fbe1a1bf92a2d0028
          path: .widget-baseline
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv sync --directory .widget-baseline --all-packages --locked
        if: matrix.revision == 'baseline'
      - run: uv run playwright install --with-deps chromium
      - run: uv sync --directory .widget-upstream/python/widget-store --locked --python 3.14
      - name: Enable measured PostgreSQL execution and WAL statistics
        env:
          WIDGET_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          psql -h localhost -U due -d widget_due -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          psql -h localhost -U due -d widget_due -c "ALTER SYSTEM SET track_io_timing = on"
          docker restart "$WIDGET_POSTGRES_CONTAINER"
          for _ in $(seq 1 30); do
            pg_isready -h localhost -U due && break
            sleep 1
          done
          psql -h localhost -U due -d widget_due -c "CREATE EXTENSION pg_stat_statements"
      - run: createdb -h localhost -U due widget_dbos
      - run: uv run python -m django migrate --noinput
      - run: uv run python -m django due_check
      - run: uv run --directory .widget-upstream/python/widget-store alembic upgrade head
      - run: uv run --directory .widget-upstream/python/widget-store python -m migrations.reset_database
      - name: Benchmark both real applications and exercise their crash buttons in Chromium
        env:
          WIDGET_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          WIDGET_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: uv run python -m scripts.widget_benchmark --due-source "$DUE_COMPARE_SOURCE" --upstream .widget-upstream --samples 5 --browser ${{ matrix.reverse && '--reverse' || '' }}
      - name: Repeat quality-gated CPU profiles separately from timing
        if: matrix.reverse == false
        run: |
          for repeat in 1 2; do
            uv run python -m scripts.widget_profile --mode cpu --output "test-results/widgets/profile/cpu-$repeat" -- --due-source "$DUE_COMPARE_SOURCE" --upstream .widget-upstream --samples 10
          done
      - name: Profile wait paths including connection-loss recovery
        if: matrix.reverse == false
        run: uv run python -m scripts.widget_profile --mode wall --output test-results/widgets/profile/wall -- --due-source "$DUE_COMPARE_SOURCE" --upstream .widget-upstream --samples 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: widget-store-${{ matrix.revision }}-reverse-${{ matrix.reverse }}
          path: test-results/widgets/
          if-no-files-found: error
