name: dry-lint judge
on:
  workflow_run:
    workflows: [dry-lint]
    types: [completed]
permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: dry-lint-judge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
jobs:
  judge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # Only trusted default-branch settings and baseline; fork code is artifact data.
      - uses: actions/checkout@v7
      - uses: gigaverse-app/dry-lint@main
        with:
          python-version: '3.14'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugins: anthropic==2.4.0
          baseline: .dry-lint/baseline.json
          require-complete: 'true'
