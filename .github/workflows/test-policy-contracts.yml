name: Test policy contracts
on:
  pull_request:
    paths:
      - '.github/test-lanes.json'
      - '.github/test-policy*.json'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/check-test-policy@f529ac3a0621870d836ec0c7ec7f3b13d46f4df4
        with:
          policy: .github/test-policy.json
          lanes: .github/test-lanes.json
          cases: .github/test-policy-cases.json
          workflow-cases: .github/test-policy-workflow-cases.json
