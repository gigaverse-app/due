name: Test policy contracts
on:
  pull_request:
    paths:
      - '.github/test-policy*.json'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/check-test-policy@7d3c74c5428208a86f4187090eda5beca1f4376d
        with:
          policy: .github/test-policy.json
          cases: .github/test-policy-cases.json
