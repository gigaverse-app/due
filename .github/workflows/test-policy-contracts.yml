name: Test policy contracts
on:
  pull_request:
    paths:
      - '.github/test-lanes.json'
      - '.github/test-policy*.json'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/check-test-policy@aacff9d4e367c5944a0af84f3892cb208b7eaea0
        with:
          policy: .github/test-policy.json
          lanes: .github/test-lanes.json
          cases: .github/test-policy-cases.json
          workflow-cases: .github/test-policy-workflow-cases.json
