name: Test policy contracts
on:
  pull_request:
    paths:
      - '.github/test-policy*.json'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/check-test-policy@6a7a1ab5ec3b87208de60edc49751d4e50b8c461
        with:
          policy: .github/test-policy.json
          cases: .github/test-policy-cases.json
          workflow-cases: .github/test-policy-workflow-cases.json
