name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  ci-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Check real Git routing against the workflow's selector revision
        run: >-
          uv run --no-project --python 3.14
          --with "$(python scripts/ci/selector_requirement.py)"
          python -m unittest discover -s ci_tests -v
      - name: Check aggregate gate against the execution lanes
        run: >-
          uv run --no-project --python 3.14
          --with "ci-esta @ https://github.com/gigaverse-app/ci-esta/archive/6914acabd398fdcef929719370257277f483dc7d.tar.gz"
          ci-esta check-workflow --workflow .github/workflows/ci.yml --lanes .github/test-lanes.json
      - name: Check local documentation links
        run: python scripts/ci/check_docs.py

  select-tests:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
      library: ${{ steps.scope.outputs.library }}
      integration: ${{ steps.scope.outputs.integration }}
      context: ${{ steps.scope.outputs.context }}
      reused: ${{ steps.evidence.outputs.reused }}
      receipt: ${{ steps.evidence.outputs.receipt }}
      django: ${{ steps.matrix.outputs.django }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        uses: gigaverse-app/pytest-selective/.github/actions/plan-lanes@6c65e923adf9e4283ba64c0db994304b3d426031
        with:
          config: .github/test-lanes.json
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test:full') }}
      - id: scope
        name: Identify the complete set of tests this execution proves
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          LANES: ${{ steps.select.outputs.lanes }}
          OUTCOME: ${{ steps.select.outcome }}
        with:
          script: |
            let lanes = {};
            try { lanes = JSON.parse(process.env.LANES || '{}') || {}; } catch { /* Unknown selection executes everything. */ }
            const library = process.env.OUTCOME !== 'success' || lanes.library !== false;
            const integration = process.env.OUTCOME !== 'success' || lanes.integration !== false;
            core.setOutput('library', library);
            core.setOutput('integration', integration);
            // Bind the actual test set into CI-esta's receipt, keeping failure identity stable.
            core.setOutput('context', JSON.stringify({library, integration}));
            let plan = {};
            try { plan = JSON.parse(require('fs').readFileSync('test-lanes.json', 'utf8')) || {}; } catch { /* No plan means fresh execution. */ }
            // Fallback coverage can differ from the deterministic plan for this tree.
            // Never cache that broader scope or resurrect it after a narrower failure.
            const reusable = process.env.OUTCOME === 'success' &&
              lanes.library === library && lanes.integration === integration &&
              typeof plan.reason === 'string' && plan.reason.trim() !== '' &&
              !/fallback|explicit full-suite checkpoint/i.test(plan.reason) &&
              plan.lanes?.library === library && plan.lanes?.integration === integration;
            core.setOutput('reusable', reusable);
      - id: evidence
        name: Find completed Django suites for these exact inputs
        if: >-
          ${{ steps.scope.outputs.reusable == 'true' && github.event_name == 'pull_request' &&
              !contains(github.event.pull_request.labels.*.name, 'test:full') &&
              (steps.scope.outputs.library != 'false' || steps.scope.outputs.integration != 'false') }}
        uses: gigaverse-app/ci-esta/.github/actions/resolve-lane-evidence@6914acabd398fdcef929719370257277f483dc7d
        with:
          # Whole-tree receipts also bind the base, head tree and shared tooling.
          lanes: '{"locked":"Execute tests (locked)","minimum":"Execute tests (minimum)"}'
          execution-context: ${{ steps.scope.outputs.context }}
      - id: matrix
        name: Start only Django variants without successful evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REUSED: ${{ steps.evidence.outputs.reused || '{}' }}
        with:
          script: |
            const proof = JSON.parse(process.env.REUSED);
            const versions = ['locked', 'minimum'].filter(version => proof[version] !== true);
            // The job condition skips both-proven work before provisioning services.
            core.setOutput('django', JSON.stringify(versions.length ? versions : ['locked', 'minimum']));

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/.github/actions/setup-cached-uv@6914acabd398fdcef929719370257277f483dc7d
        with:
          python-version: '3.14'
          sync-args: --all-packages --only-group lint
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pre-commit validate-config
      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  typecheck:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).typecheck) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/.github/actions/setup-cached-uv@6914acabd398fdcef929719370257277f483dc7d
        with:
          python-version: '3.14'
          sync-args: --all-packages
      - run: uv run --no-sync pyrefly check

  tests:
    name: Execute tests (${{ matrix.django }})
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          ((needs.select-tests.outputs.library != 'false' || needs.select-tests.outputs.integration != 'false') &&
           (toJSON(fromJSON(needs.select-tests.outputs.reused || '{}').locked) != 'true' ||
            toJSON(fromJSON(needs.select-tests.outputs.reused || '{}').minimum) != 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        django: ${{ fromJSON(needs.select-tests.result == 'success' && needs.select-tests.outputs.django || '["locked","minimum"]') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: due
          POSTGRES_PASSWORD: due
          POSTGRES_DB: due
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U due"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DUE_DATABASE_URL: postgresql://due:due@localhost:5432/due
      DUE_BROKER_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/.github/actions/setup-cached-uv@6914acabd398fdcef929719370257277f483dc7d
        with:
          python-version: '3.14'
          sync-args: --all-packages
      - name: Exercise the declared Django lower bound
        if: matrix.django == 'minimum'
        run: uv pip install 'django==6.0.8'
      - name: Prove the package export has no dependency on this repository
        if: ${{ (needs.select-tests.result != 'success' || needs.select-tests.outputs.library != 'false') && matrix.django == 'locked' }}
        run: |
          package_dir=$(mktemp -d)
          git archive HEAD:package | tar -x -C "$package_dir"
          uv run --directory "$package_dir" --extra selftest python -m pytest -n 4 --dist worksteal --due-work-check-fixtures
      - name: Run library controls without demo applications
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.library != 'false' }}
        working-directory: package
        run: ../.venv/bin/python -m pytest -n 4 --dist worksteal --due-work-check-fixtures --junitxml=../library-timings.xml
      - name: Run full suite including live web, worker and Beat recovery
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        run: uv run --no-sync pytest -n 4 --dist worksteal --due-work-check-fixtures --basetemp=test-results -p due.django.conformance.reporting --due-work-debt-baseline=integration_tests/conformance/debt_baseline.yaml --due-work-profile-report=profiles.json --durable-work-report=effects.json --durable-observation-report=observations.json --junitxml=test-timings.xml -o junit_family=xunit1
      - uses: gigaverse-app/ci-esta/.github/actions/learn-test-timings@6914acabd398fdcef929719370257277f483dc7d
        if: ${{ success() && hashFiles('test-timings.xml') != '' }}
        with:
          junit-pattern: test-timings.xml
          artifact-name: test-timings-${{ matrix.django }}
      - name: Require executed obligation guarantees
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract "Due replay-safe work table" --verified A B D I J
      - name: Require complete application conformance
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract publish_document --verified A B D E H I J --effect-report effects.json --effect publish_document --required-effect-case "test_due_work_contract[process-document process death-assert_process_deaths_converge]"
      - name: Require complete book indexing conformance
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract index_book --verified A B D H I J --effect-report effects.json --effect index_book --required-effect-case "test_due_work_contract[completion-searchable book-assert_completes_within]" --required-effect-case "test_immutable_inputs_hold[admission-create book]" --required-effect-case "test_immutable_inputs_hold[admission_failure-create book]" --required-effect-case "test_due_work_contract[process-book indexing and publication process death-assert_process_deaths_converge]"
      - name: Require complete book publication conformance
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract publish_book --verified A B D H J --effect-report effects.json --effect publish_book --required-effect-case "test_immutable_inputs_hold[producer-index settlement]"
      - name: Require catalog projection conformance
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract project_catalog --verified A B D E H I J --effect-report effects.json --effect project_catalog
      # Non-repeatable orders decline harmless replay and retain evidence indefinitely.
      - name: Require observed print-order conformance
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract print_order --verified A B C I J --effect-report effects.json --effect print_order
      - name: Require scheduled publication conformance
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract publish_at_deadline --verified A B E H I J --effect-report effects.json --effect publish_at_deadline --required-effect-case "test_due_work_contract[process-scheduled publication process death-assert_process_deaths_converge]"
      - name: Require widget checkout guarantees and crash histories
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract checkout_order --verified A B G I J --effect-report effects.json --effect checkout_order --required-effect-case "test_due_work_contract[delivery-replay-reconnected dispatch-assert_delivery_replay]" --required-effect-case "test_due_work_contract[completion-paid hints-assert_completes_within]" --required-effect-case "test_due_work_contract[completion-paid sweep-assert_completes_within]" --required-effect-case "test_due_work_contract[completion-failed hints-assert_completes_within]" --required-effect-case "test_due_work_contract[completion-failed sweep-assert_completes_within]" --required-effect-case "test_due_work_contract[delivery-replay-final dispatch-assert_delivery_replay]" --required-effect-case "test_due_work_contract[process-widget paid process death-assert_process_deaths_converge]" --required-effect-case "test_due_work_contract[process-widget failed process death-assert_process_deaths_converge]" --required-effect-case "test_due_work_contract[process-widget paid process death without hints-assert_process_deaths_converge]" --required-effect-case "test_due_work_contract[process-widget failed process death without hints-assert_process_deaths_converge]"
      - name: Validate application setup
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        run: uv run --no-sync python -m django due_check
        env:
          DJANGO_SETTINGS_MODULE: examples.settings
      - run: uv run --no-sync python -m django makemigrations --check --dry-run
        if: ${{ needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false' }}
        env:
          DJANGO_SETTINGS_MODULE: examples.settings
      - uses: actions/upload-artifact@v7
        if: ${{ always() && (needs.select-tests.result != 'success' || needs.select-tests.outputs.integration != 'false') }}
        with:
          name: obligation-profiles-${{ matrix.django }}
          path: |
            profiles.json
            effects.json
            observations.json
            library-timings.xml
            test-results/**/*.log
          if-no-files-found: error
      - name: 'PR evidence #${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }}'
        if: ${{ github.event_name == 'pull_request' }}
        run: echo 'All admitted tests, conformance checks and artifact uploads passed.'
      - name: ${{ needs.select-tests.outputs.receipt || 'No execution receipt' }}
        if: ${{ needs.select-tests.result == 'success' && needs.select-tests.outputs.receipt != '' }}
        run: echo 'Recording completed execution for this Django variant and tested tree.'

  test-gates:
    name: tests (${{ matrix.django }})
    needs: [select-tests, tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        django: [locked, minimum]
    steps:
      # Keep required check names present even when the expensive matrix is skipped.
      # Reused suites never emit a new receipt or extend its 24-hour lifetime.
      - name: Require successful planning and executed or proven tests
        uses: gigaverse-app/ci-esta/.github/actions/validation-gate@6914acabd398fdcef929719370257277f483dc7d
        with:
          needs: ${{ toJSON(needs) }}
          required: >-
            {"select-tests":true,"tests":${{ needs.select-tests.result != 'success' ||
              ((needs.select-tests.outputs.library != 'false' || needs.select-tests.outputs.integration != 'false') &&
               (toJSON(fromJSON(needs.select-tests.outputs.reused || '{}').locked) != 'true' ||
                toJSON(fromJSON(needs.select-tests.outputs.reused || '{}').minimum) != 'true')) }}}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build --project package --out-dir dist
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - run: python scripts/ci/check_metadata.py
      - name: Install the wheel without development dependencies
        run: |
          uv venv /tmp/due-wheel
          uv pip install --python /tmp/due-wheel dist/*.whl
          /tmp/due-wheel/bin/python -I scripts/check_wheel.py
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  validation-gate:
    name: Validation gate
    needs: [ci-contracts, select-tests, lint, typecheck, test-gates, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: gigaverse-app/ci-esta/.github/actions/validation-gate@6914acabd398fdcef929719370257277f483dc7d
        with:
          needs: ${{ toJSON(needs) }}
          lanes: ${{ needs.select-tests.outputs.lanes || '{}' }}
          lane-jobs: '{"typecheck":["typecheck"]}'
