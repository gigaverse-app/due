name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --only-group lint
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pre-commit validate-config
      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pyrefly check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        django: [locked, minimum]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: due
          POSTGRES_PASSWORD: due
          POSTGRES_DB: due
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U due"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DUE_DATABASE_URL: postgresql://due:due@localhost:5432/due
      DUE_BROKER_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Exercise the declared Django lower bound
        if: matrix.django == 'minimum'
        run: uv pip install 'django==6.0.8'
      - name: Run full suite including live web, worker and Beat recovery
        run: uv run --no-sync pytest --basetemp=test-results -p due.django.conformance.reporting --due-work-debt-baseline=tests/conformance/debt_baseline.yaml --due-work-profile-report=profiles.json --durable-work-report=effects.json --durable-observation-report=observations.json
      - name: Require executed obligation guarantees
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract "Due replay-safe work table" --verified A B D I J
      - name: Require complete application conformance
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract publish_document --verified A B D E H I J --effect-report effects.json --effect publish_document
      - name: Require complete book indexing conformance
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract index_book --verified A B D H I J --effect-report effects.json --effect index_book --unassessed "test_due_work_contract[E-not_assessed]"
      - name: Require complete book publication conformance
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract publish_book --verified A B D H J --effect-report effects.json --effect publish_book --unassessed "test_due_work_contract[E-not_assessed]"
      - name: Require catalog projection conformance
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract project_catalog --verified A B D E H I J --effect-report effects.json --effect project_catalog
      # Non-repeatable orders decline harmless replay and retain evidence indefinitely.
      - name: Require observed print-order conformance
        run: uv run --no-sync python scripts/check_adoption_report.py profiles.json --contract print_order --verified A B C I J --effect-report effects.json --effect print_order
      - name: Validate application setup
        run: uv run --no-sync python -m django due_check
        env:
          DJANGO_SETTINGS_MODULE: examples.settings
      - run: uv run --no-sync python -m django makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: examples.settings
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: obligation-profiles-${{ matrix.django }}
          path: |
            profiles.json
            effects.json
            observations.json
            test-results/**/*.log
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
      - name: Install the wheel without development dependencies
        run: |
          uv venv /tmp/due-wheel
          uv pip install --python /tmp/due-wheel dist/*.whl
          /tmp/due-wheel/bin/python -I scripts/check_wheel.py
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
