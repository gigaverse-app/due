name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: due
          POSTGRES_PASSWORD: due
          POSTGRES_DB: due
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U due"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DUE_DATABASE_URL: postgresql://due:due@localhost:5432/due
      DUE_BROKER_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run pytest --due-work-profile-report=profiles.json
      - run: uv run python -m django makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: examples.settings
      - run: uv build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obligation-profiles
          path: profiles.json
