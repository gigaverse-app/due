    insert tests_batchreceipt: 1
    lock due_effectattempt: 1
    lock tests_composedchunk: 3
    read tests_batchreceipt: 1
    select clock_timestamp(): 1
    select clock_timestamp(), exists (…): 1
    update due_effectattempt: 2
    update tests_batchreceipt: 2
    update tests_composedchunk: 3
- contract: 'composed_chunk_self_test: per owed row'
