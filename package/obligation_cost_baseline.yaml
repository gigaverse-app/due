# Cost contracts: the database statements each named path sends, by shape.
#
# A test fails when a path sends a statement its entry does not list (a regression) or no
# longer sends one it does (a saving the entry must keep). Record or lower entries with
# `OBLIGATION_COST_BASELINE=update pytest -p no:xdist <tests>` and review the diff: it is
# the cost change of the PR.
#
# Canonical doc: docs/cost-contracts.md

costs:
- contract: 'batch_self_test: idle tick'
  statements:
    count due_recoverydeferral: 1
    count tests_batchwork: 1
    read due_recoverydeferral: 1
    read tests_batchwork: 4
    select clock_timestamp(): 3
- contract: 'batch_self_test: one delivery'
  statements:
    begin: 4
    commit: 4
    insert due_effectattempt: 1
    insert tests_batchreceipt: 1
    lock due_effectattempt: 2
    lock tests_batchwork: 3
    lock tests_primitiveowner: 2
    read tests_batchreceipt: 2
    select clock_timestamp(): 1
    select clock_timestamp(), exists (…): 1
    update due_effectattempt: 2
    update tests_batchreceipt: 2
    update tests_batchwork: 4
    update tests_primitiveowner: 1
- contract: 'batch_self_test: per owed row'
  statements:
    begin: 1
    commit: 1
    lock tests_batchwork: 1
    update tests_batchwork: 1
- contract: 'chunk_self_test: idle tick'
  statements:
    count due_recoverydeferral: 1
    count tests_chunk: 1
    read due_recoverydeferral: 1
    read tests_chunk: 4
    select clock_timestamp(): 3
- contract: 'chunk_self_test: one delivery'
