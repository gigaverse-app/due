[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "django-due"
dynamic = ["version"]
description = "Durable obligations for Django and PostgreSQL"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gigaverse" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12,<3",
    "psycopg[binary]>=3.2,<4",
    "celery>=5.6,<6",
    "django>=6.0.8,<7",
    "prometheus-client>=0.22",
    "sentry-sdk>=2,<3",
    "asgiref>=3.9",
]

[project.optional-dependencies]
# Dependencies for the reusable tests shipped alongside the source.
selftest = ["django-due[testing,redis,beat]", "pytest>=8.4", "pytest-mock>=3.16", "pytest-xdist>=3.8", "pytest-asyncio>=1.2"]
testing = ["pytest-obligation[django,celery,exploration,debt]>=0.22.0,<1"]
redis = ["celery[redis]>=5.6,<6"]
beat = ["django-celery-beat>=2.8"]

[project.urls]
Documentation = "https://due.readthedocs.io/en/latest/"
Homepage = "https://github.com/gigaverse-app/due"
Repository = "https://github.com/gigaverse-app/due"
Issues = "https://github.com/gigaverse-app/due/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/due"]

[project.entry-points.pytest11]
due_work_tables = "due.pytest_plugin"


[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["no_db: does not access the database"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
# Embedded subtrees must not take a version from their parent repository's tags.
fallback_version = "0.1.0.dev0"


[tool.uv.sources]
# Reviewed PR #178 source supplies the provider-wait proof used by conformance.
# Replace with its release during publication; wheel metadata has no Git source.
pytest-obligation = { git = "https://github.com/gigaverse-app/pytest-obligation.git", rev = "d9c0e86", subdirectory = "package" }

[tool.ruff]
src = ["src", "shims", "."]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B027"]
