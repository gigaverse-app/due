site_name: Due
site_description: Recover Django background work after crashes with durable work tables
  and explicit completion evidence.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://due.readthedocs.io/en/latest/"]
repo_url: https://github.com/gigaverse-app/due
repo_name: gigaverse-app/due
edit_uri: ''
docs_dir: documentation
site_dir: site
strict: true
exclude_docs: '*.py

  *.txt

  *.in

  overrides/

  '
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/icon.png
  custom_dir: documentation/overrides
  language: en
  font: false
  palette:
    primary: teal
    accent: cyan
  features:
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search
hooks:
- documentation/hooks.py
markdown_extensions:
- admonition
- attr_list
- tables
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
- toc:
    permalink: true
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
extra:
  published_sources:
  - package/docs/quickstart.md
  - package/docs/django-tasks-quickstart.md
  - package/docs/api-guide.md
  - docs/acme-printworks-tutorial.md
  - docs/alternatives.md
  - docs/ci-toolkit.md
  - docs/recovery-walkthrough.md
  - docs/why-due.md
  - package/docs/architecture.md
  - package/docs/capabilities.md
  - package/docs/completion-leases.md
  - package/docs/conformance-api.md
  - package/docs/conformance.md
  - package/docs/integration.md
  - package/docs/django-tasks.md
  - package/docs/migrations.md
  - package/docs/migrations/arq.md
  - package/docs/migrations/celery.md
  - package/docs/migrations/chancy.md
  - package/docs/migrations/dbos.md
  - package/docs/migrations/django-q2.md
  - package/docs/migrations/django-rq.md
  - package/docs/migrations/django-tasks-db.md
  - package/docs/migrations/django-tasks-rq.md
  - package/docs/migrations/django-tasks.md
  - package/docs/migrations/dramatiq.md
  - package/docs/migrations/huey.md
  - package/docs/migrations/pgmq.md
  - package/docs/migrations/pgqueuer.md
  - package/docs/migrations/procrastinate.md
