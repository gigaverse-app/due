[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "due"
version = "0.1.0a1"
description = "Durable obligations for Django and PostgreSQL"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gigaverse" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12,<3",
    "psycopg[binary]>=3.2,<4",
    "celery>=5.6,<6",
    "django>=6.0.8,<7",
    "prometheus-client>=0.22",
    "sentry-sdk>=2,<3",
    "asgiref>=3.9",
]

[project.optional-dependencies]
testing = ["pytest-obligation[django,celery,exploration,debt] @ git+https://github.com/gigaverse-app/pytest-obligation.git@9d8e0fe892fcb7586ab4a0e02ba5fc91a229c606"]
redis = ["celery[redis]>=5.6,<6"]
beat = ["django-celery-beat>=2.8"]

[project.urls]
Homepage = "https://github.com/gigaverse-app/due"
Repository = "https://github.com/gigaverse-app/due"
Issues = "https://github.com/gigaverse-app/due/issues"

[dependency-groups]
lint = ["ruff>=0.14", "pre-commit>=4.3"]
dev = [
    { include-group = "lint" },
    "pytest>=8.4",
    "pytest-obligation[celery,django,exploration,debt] @ git+https://github.com/gigaverse-app/pytest-obligation.git@9d8e0fe892fcb7586ab4a0e02ba5fc91a229c606",
    "pyrefly>=1,<2",
    "celery-types>=0.26",
    "django-stubs>=5.2",
    "django-celery-beat>=2.8",
    "redis>=5",
    "pytest-mock>=3.16.0",
    "pytest-xdist>=3.8",
    "pytest-asyncio>=1.2",
    "procrastinate>=3,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/due"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B027"]

[tool.pyrefly]
project-includes = ["src", "tests", "examples", "scripts"]
python-version = "3.14"
search-path = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["no_db: does not access the database"]

[project.entry-points.pytest11]
due_work_tables = "due.pytest_plugin"

[tool.hatch.metadata]
allow-direct-references = true
