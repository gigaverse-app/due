[dependency-groups]
lint = ["ruff>=0.14", "pre-commit>=4.3"]
dev = [
    "django-due[selftest]",
    { include-group = "lint" },
    "pyrefly>=1,<2",
    "celery-types>=0.26",
    "django-stubs>=5.2",
    "procrastinate>=3,<4",
]

[tool.ruff]
src = ["package/src", "package/shims", "package", "."]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B027"]

[tool.pyrefly]
project-includes = ["package/src", "package/tests", "integration_tests", "examples", "scripts"]
python-version = "3.14"
search-path = ["package/src", "package", "."]

[tool.pytest.ini_options]
testpaths = ["integration_tests"]
DJANGO_SETTINGS_MODULE = "integration_tests.settings"
pythonpath = ["package", "."]
addopts = "--strict-markers"
markers = ["no_db: does not access the database"]


[tool.uv.workspace]
members = ["package"]

[tool.uv.sources]
django-due = { workspace = true }
