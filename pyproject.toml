[dependency-groups]
lint = ["ruff>=0.14", "pre-commit>=4.3"]
dev = [
    "django-due[selftest]",
    { include-group = "lint" },
    "pyrefly>=1,<2",
    "celery-types>=0.26",
    "django-stubs>=5.2",
    "procrastinate>=3,<4",
    "playwright>=1.58,<2",
    "psutil>=7,<8",
    "psycopg-pool>=3.2,<4",
    "yappi==1.7.6",
]

[tool.ruff]
extend = "package/pyproject.toml"
src = ["package/src", "package/shims", "package", "."]

[tool.pyrefly]
project-includes = ["package/src", "package/tests", "integration_tests", "examples", "scripts"]
python-version = "3.14"
search-path = ["package/src", "package", ".", "examples/acme_printworks"]

[tool.pytest.ini_options]
testpaths = ["integration_tests"]
DJANGO_SETTINGS_MODULE = "integration_tests.settings"
pythonpath = ["package", "."]
addopts = "--strict-markers"
markers = ["no_db: does not access the database"]


[tool.uv.workspace]
members = ["package"]

[tool.uv.sources]
django-due = { workspace = true }

[tool.uv]
# Candidate verification only. Remove after obligation's lifecycle API is released.
override-dependencies = ["pytest-obligation[django,celery,exploration,debt] @ git+https://github.com/gigaverse-app/pytest-obligation.git@547098d552013d52ee147daf0269b571a1efae00#subdirectory=package"]
