[dependency-groups]
lint = ["ruff>=0.14", "pre-commit>=4.3"]
dev = [
    "django-due[selftest]",
    { include-group = "lint" },
    "pyrefly>=1,<2",
    "celery-types>=0.26",
    "django-stubs>=5.2",
    "procrastinate>=3,<4",
    "playwright>=1.58,<2",
    "psutil>=7,<8",
    "psycopg-pool>=3.2,<4",
    "yappi==1.7.6",
]

[tool.ruff]
extend = "package/pyproject.toml"
src = ["package/src", "package/shims", "package", "."]

[tool.pyrefly]
project-includes = ["package/src", "package/tests", "integration_tests", "examples", "scripts"]
python-version = "3.14"
search-path = ["package/src", "package", ".", "examples/acme_printworks"]

[tool.pytest.ini_options]
testpaths = ["integration_tests"]
DJANGO_SETTINGS_MODULE = "integration_tests.settings"
pythonpath = ["package", "."]
addopts = "--strict-markers"
markers = ["no_db: does not access the database"]


[tool.uv.workspace]
members = ["package"]

[tool.uv.sources]
django-due = { workspace = true }
# Cost contracts (pytest-obligation#198); re-pin to the release once it is published.
pytest-obligation = { git = "https://github.com/gigaverse-app/pytest-obligation", rev = "1af53bc8f0e3d1035a1506b1fb19602d962dc55b", subdirectory = "package" }
