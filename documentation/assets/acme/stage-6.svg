<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210">
<style>text{font-family:DejaVu Sans,Arial,sans-serif}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#62778a"/></marker></defs>
<rect width="1200" height="1210" fill="#f3f6fa"/>
<text x="32" y="46" fill="#137b80" font-size="19" font-weight="700">ACME PRINTWORKS  /  WILLOW CAFE  /  JOB 418</text>
<text x="32" y="100" fill="#163449" font-size="37" font-weight="700">6. Keep the promises after changes</text>
<rect x="32" y="130" width="1136" height="145" rx="16" fill="#eaf2ff" stroke="#345986" stroke-width="2"/><text x="56" y="165" fill="#345986" font-size="20" font-weight="700">CUSTOMER GOAL</text><text x="56" y="207" fill="#163449" font-size="28" font-weight="400">Acme wants the next deployment to preserve the customer&#x27;s proof and single</text>
<text x="56" y="244" fill="#163449" font-size="28" font-weight="400">order.</text>
<rect x="32" y="325" width="548" height="245" rx="16" fill="#ebf7f1" stroke="#24734d" stroke-width="2"/><text x="56" y="360" fill="#24734d" font-size="20" font-weight="700">HAPPY PATH</text><text x="56" y="402" fill="#163449" font-size="28" font-weight="400">Bind application contracts;</text>
<text x="56" y="439" fill="#163449" font-size="28" font-weight="400">generate and run the shared</text>
<text x="56" y="476" fill="#163449" font-size="28" font-weight="400">failure histories in CI.</text>
<rect x="620" y="325" width="548" height="245" rx="16" fill="#fff5df" stroke="#946321" stroke-width="2"/><text x="644" y="360" fill="#946321" font-size="20" font-weight="700">EXTERNAL DISRUPTION</text><text x="644" y="402" fill="#163449" font-size="28" font-weight="400">A new renderer or printer</text>
<text x="644" y="439" fill="#163449" font-size="28" font-weight="400">adapter changes timeout or</text>
<text x="644" y="476" fill="#163449" font-size="28" font-weight="400">retry behavior. The developer</text>
<text x="644" y="513" fill="#163449" font-size="28" font-weight="400">tests only success.</text>
<rect x="32" y="620" width="548" height="260" rx="16" fill="#ebf7f1" stroke="#24734d" stroke-width="2"/><text x="56" y="655" fill="#24734d" font-size="20" font-weight="700">GOOD OUTCOME</text><text x="56" y="697" fill="#163449" font-size="28" font-weight="400">Changes are checked against</text>
<text x="56" y="734" fill="#163449" font-size="28" font-weight="400">actual customer outcomes and</text>
<text x="56" y="771" fill="#163449" font-size="28" font-weight="400">independently stored provider</text>
<text x="56" y="808" fill="#163449" font-size="28" font-weight="400">records.</text>
<rect x="620" y="620" width="548" height="260" rx="16" fill="#fff0ee" stroke="#aa4439" stroke-width="2"/><text x="644" y="655" fill="#aa4439" font-size="20" font-weight="700">BAD OUTCOME WITHOUT PROTECTION</text><text x="644" y="697" fill="#163449" font-size="28" font-weight="400">The next outage exposes</text>
<text x="644" y="734" fill="#163449" font-size="28" font-weight="400">duplicate purchases, stale</text>
<text x="644" y="771" fill="#163449" font-size="28" font-weight="400">proofs or abandoned files.</text>
<rect x="32" y="925" width="1136" height="255" rx="16" fill="#e9f5f6" stroke="#137b80" stroke-width="2"/><text x="56" y="960" fill="#137b80" font-size="20" font-weight="700">DUE RESPONSE AND ITS LIMIT</text><text x="56" y="1002" fill="#163449" font-size="28" font-weight="400">Contract-generated tests exercise declared failure cases. Enrollment</text>
<text x="56" y="1039" fill="#163449" font-size="28" font-weight="400">checks catch omitted suites; application observations detect the wrong</text>
<text x="56" y="1076" fill="#163449" font-size="28" font-weight="400">result.</text>
<path d="M306 275V315" fill="none" stroke="#62778a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M894 275V315" fill="none" stroke="#62778a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M306 570V610" fill="none" stroke="#62778a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M894 570V610" fill="none" stroke="#62778a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M894 880V915" fill="none" stroke="#62778a" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
