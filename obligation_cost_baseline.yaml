    begin: 2
    commit: 2
    count catalog_catalogwork: 1
    count due_effectattempt: 1
    count due_recoverydeferral: 1
    lock catalog_catalogwork: 1
    read catalog_catalogwork: 2
    read due_effectattempt: 2
    read due_recoverydeferral: 1
    select clock_timestamp(): 5
