services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: acme
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
    ports: ["127.0.0.1:55451:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    ports: ["127.0.0.1:56399:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
